services:
  postgres:
    image: postgres:16-alpine
    container_name: danslafoule-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-danslafoule}
      POSTGRES_USER: ${POSTGRES_USER:-danslafoule}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-danslafoule}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-danslafoule} -d ${POSTGRES_DB:-danslafoule}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
