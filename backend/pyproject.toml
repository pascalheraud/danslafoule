[tool.poetry]
name = "danslafoule-backend"
version = "0.1.0"
description = "Dans la foule — FastAPI backend"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.11,<3.12"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
sqlalchemy = "^2.0"
psycopg = { extras = ["binary"], version = "^3.2" }
pydantic-settings = "^2.6"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
httpx = "^0.27"
testcontainers = {extras = ["postgres"], version = "^4.15.0"}
danslafoule-testdata = {path = "../testdata", develop = true}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
